function toolStore(){return Model.machine.toolCenter||(Model.machine.toolCenter={tools:toolSeed()})}
function findTool(id){return toolStore().tools.find(t=>t.id===id)}
function toolHasUpdate(t){return t.checkState==='ok'&&!!t.latest&&t.latest!==t.version}
function linkedToolSkill(t){return t.skill?Model.find(t.skill.domain+':'+t.skill.name):null}
function toolStatus(t){if(t.checkState==='failed')return '<span class="badge amber">检查失败</span>';if(t.checkState==='unconfigured')return '<span class="badge gray">待补检查方式</span>';if(t.checkState==='unchecked')return '<span class="badge gray">尚未检查</span>';return toolHasUpdate(t)?'<span class="badge amber">有更新</span>':'<span class="badge green">已是最新</span>'}
function toolSkillBadge(t){return t.skill?`<span class="badge ${linkedToolSkill(t)?'green':'blue'}">${I('layers')}${linkedToolSkill(t)?'Skill 已入库':'有 Skill · 待入库'}</span>`:'<span class="badge gray">未登记 Skill</span>'}
function toolCard(t){const installed=t.installed!==false;return `<article class="tool-card card" data-tool-id="${e(t.id)}"><div class="tool-card-head">${I('tool')}<h3><button class="plain skill-name" title="${e(t.name)}" data-action="tool-detail" data-id="${e(t.id)}">${e(t.name)}</button></h3><span class="badge ${installed?'green':'gray'}">${installed?'本机已安装':'未安装'}</span></div><div class="card-body" data-action="tool-detail" data-id="${e(t.id)}"><p class="description">${e(t.summary)}</p><div class="tags">${tags(t.tags)}${toolSkillBadge(t)}${t.guide?'':'<span class="badge amber">待补维护指南</span>'}</div><div class="tool-version-line">${installed?`本机 ${e(t.version||'-')}`:'本机未安装'}${t.latest?` → 上游 ${e(t.latest)}`:' · 上游版本未知'}</div></div><div class="card-foot">${toolStatus(t)}<span class="flex-spacer"></span><button class="plain tool-detail-link" data-action="tool-detail" data-id="${e(t.id)}">查看详情</button></div></article>`}
function toolCenter(){if(toolId&&findTool(toolId))return toolDetailPage(findTool(toolId));const all=toolStore().tools,scoped=all.filter(t=>!toolCategory||t.category===toolCategory),cats=[...new Set(all.map(t=>t.category))],items=scoped.filter(t=>(!toolQuery||[t.name,t.summary,t.category,...t.tags].join(' ').toLowerCase().includes(toolQuery.toLowerCase()))&&(toolFilter==='all'||toolFilter==='updates'&&toolHasUpdate(t)||toolFilter==='skill'&&t.skill&&!linkedToolSkill(t)||toolFilter==='guide'&&!t.guide||toolFilter==='attention'&&['failed','unconfigured','unchecked'].includes(t.checkState)));
 const installed=all.filter(t=>t.installed!==false).length,updates=all.filter(toolHasUpdate).length,pendingSkill=all.filter(t=>t.skill&&!linkedToolSkill(t)).length,noGuide=all.filter(t=>!t.guide).length;
 const stats=[['本机已安装',installed,false],['有更新',updates,updates>0],['配套 Skill 待入库',pendingSkill,pendingSkill>0],['待补维护指南',noGuide,noGuide>0]];
 return head('工具中心',all.length)+`<div class="tool-intro"><span class="note">软件只检查登记来源；安装、更新与核实回写由外部 Agent 完成。</span><div class="tool-intro-actions">${B(I('refresh')+(toolChecking?'正在检查…':'检查全部'),'tools-check',toolChecking?'disabled':'','compact')}${B(I('plus')+'安装 / 登记工具','tool-register','','compact primary')}</div></div><div class="tool-stats">${stats.map(([l,n,on])=>`<div class="tool-stat ${on?'on':''}"><span>${l}</span><strong>${n}</strong></div>`).join('')}</div><div class="toolbar tool-toolbar"><div class="left"><label class="search">${I('search')}<input id="tool-search" placeholder="搜索工具名称、用途或能力标签…" value="${e(toolQuery)}"></label><div class="seg">${[['all','全部'],['updates','有更新'],['attention','检查待处理']].map(([v,l])=>`<button class="${toolFilter===v?'on':''}" data-action="tool-filter" data-value="${v}">${l}</button>`).join('')}</div></div></div><div class="library-layout"><aside class="category-rail"><button class="category ${!toolCategory?'selected':''}" data-action="tool-category" data-value="">全部分类 <span class="tinycount">${all.length}</span></button>${cats.map(c=>`<button class="category ${toolCategory===c?'selected':''}" data-action="tool-category" data-value="${e(c)}">${e(c)}<span class="tinycount">${all.filter(t=>t.category===c).length}</span></button>`).join('')}</aside><div class="grid tools-grid">${items.map(toolCard).join('')||'<div class="empty-state">当前筛选下没有工具。</div>'}</div></div>`}
function toolGuideHTML(text){return `<div class="tool-guide-document">${text.split('\n').map(line=>line.startsWith('## ')?'<h3>'+e(line.slice(3))+'</h3>':line.startsWith('# ')?'<h2>'+e(line.slice(2))+'</h2>':line?'<p>'+e(line)+'</p>':'').join('')}</div>`}
function toolIntroduction(t){return t.introduction||({
 'browser-use':'browser-use 是用于浏览器任务的自动化工具，可以让 Agent 通过浏览器访问网站、操作页面，并取得完成任务所需的信息。它提供的是实际浏览器操作能力，配套 Skill 则说明 Agent 应在什么情况下、按什么流程使用这些能力。\n\n在本工具中心的使用示例中，它用于需要进入网页完成的工作：浏览资料、填写表单、执行页面操作，以及读取操作后的结果。具体可用能力以实际安装的版本和配置为准。\n\n适用场景：需要网页交互的资料收集、重复性页面操作，以及无法只靠本地文件或普通接口完成的任务。',
 'uv':'uv 是面向 Python 项目的环境与包管理工具，用于准备依赖环境、运行 Python 程序，以及管理通过 Python 分发的命令行工具。\n\n把它登记在工具中心后，可以知道电脑上的 Python 工具由什么方式安装、使用哪个入口，便于 Agent 后续按原安装方式维护。\n\n适用场景：准备项目运行环境、安装和调用 Python 工具、整理依赖与环境配置。',
 'ffmpeg':'FFmpeg 是用于音视频处理的命令行工具，可以在终端、脚本或 Agent 工作流中转换和处理媒体文件。它的使用通常由具体任务和参数驱动。\n\n工具中心用于记录本机安装方式和入口；配套 Skill 可以进一步说明适合本人的处理流程、参数要求以及输出文件约定。\n\n适用场景：媒体格式转换、音视频裁剪、音轨提取，以及重复批量处理。',
 'ripgrep':'ripgrep 是用于搜索文件内容的命令行工具，常用于从代码、文档和本地资料中快速定位需要的信息。\n\nAgent 可以把搜索结果作为继续阅读文件和分析问题的入口。登记其安装位置和维护方式，有助于确认本机有哪些可直接使用的检索能力。\n\n适用场景：定位代码与配置、搜索文档关键词、查找批量文本中的线索。',
 'comfyui':'ComfyUI 是通过节点工作流组织图像生成与处理任务的工具。工作流把不同处理步骤连接起来，便于重复执行和调整流程。\n\n本示例将它作为本机服务登记，工具中心记录服务入口、安装目录和维护资料；相关 Skill 用于说明如何使用自己的工作流。\n\n适用场景：运行本地图像工作流、重复处理素材，以及围绕已有流程调整生成步骤。',
 'docker':'Docker CLI 是用于管理容器、镜像及相关资源的命令行入口，可以从终端、脚本或 Agent 中调用。实际可用性取决于本机容器运行环境。\n\n工具中心记录 CLI 的来源和配置位置，维护指南说明如何更新和验证；龙虾技能库中的容器管理 Skill 则承载具体操作流程。\n\n适用场景：查看与维护容器、管理镜像和执行已有容器服务的日常运维。'
 })[t.id]||t.summary}
function toolIntroductionPanel(t){return `<section class="tool-panel tool-introduction"><h2>工具简介</h2>${toolIntroduction(t).split(/\n\s*\n/).map(p=>`<p>${e(p)}</p>`).join('')}</section>`}
function toolDetailPage(t){return `<div class="breadcrumbs"><button data-action="tool-back">${I('back')}工具中心</button><span>/</span><span>${e(t.name)}</span></div><div class="tool-detail-title"><span class="tool-logo ${t.color}">${I(t.icon)}</span><div><h1>${e(t.name)}</h1><p>${e(t.summary)}</p></div><span class="badge gray">本机已安装</span></div><div class="toolbar tool-detail-toolbar"><div class="seg">${[['overview','概览'],['guide','维护指南'],['skill','配套 Skill'],['updates','版本与更新']].map(([v,l])=>`<button class="${toolTab===v?'on':''}" data-action="tool-tab" data-value="${v}">${l}${v==='guide'&&!t.guide?' · 待补':''}</button>`).join('')}</div><div class="right">${B(I('refresh')+'检查更新','tool-check',dataId(t.id)+(toolChecking?' disabled':''))}${B(toolHasUpdate(t)?'交给 Agent 更新':'生成维护任务','tool-task-update',dataId(t.id),'primary')}</div></div>${toolTab==='overview'?`${toolIntroductionPanel(t)}<div class="tool-detail-columns"><div><section class="tool-panel"><h2>调用入口与能力标签</h2><div class="tags">${tags(t.tags)}</div><div class="tool-entry"><span>使用入口</span><code>${e(t.entry)}</code>${iconButton('copy','tool-copy-entry',dataId(t.id),'复制入口')}</div><p class="muted">复制后可交给 Agent 使用；服务入口在真实软件中的打开方式待讨论，原型不启动本机服务。</p></section><section class="tool-panel"><div class="tool-panel-head"><h2>维护指南</h2><span class="badge ${t.guide?'green':'amber'}">${t.guide?'安装时由 Agent 编写':'尚未补充'}</span></div><p class="muted">记录实际安装方式、配置位置、更新操作和验证步骤。</p>${B(t.guide?'阅读维护指南':'让 Agent 补写指南',t.guide?'tool-guide':'tool-task-guide',dataId(t.id),'green')}</section></div><div><section class="tool-panel"><h2>本机安装记录</h2><dl class="tool-facts"><dt>当前版本</dt><dd><code>${e(t.version)}</code></dd><dt>安装方式</dt><dd>${e(t.method)}</dd><dt>安装位置</dt><dd><code>${e(t.path)}</code></dd><dt>配置位置</dt><dd><code>${e(t.config)}</code></dd><dt>分类</dt><dd>${e(t.category)}</dd></dl></section><section class="tool-panel"><div class="tool-panel-head"><h2>配套 Skill</h2>${toolSkillBadge(t)}</div><p class="muted">${t.skill?e(t.skill.name)+' · 在技能库中统一维护与部署。':'暂无已登记的配套 Skill。'}</p>${B('查看 Skill 信息','tool-tab','data-value="skill"','green')}</section></div></div>`:toolTab==='guide'?`<section class="tool-panel"><div class="tool-panel-head"><h2>Agent 维护指南</h2>${B('生成指南维护任务','tool-task-guide',dataId(t.id),'green')}</div>${t.guide?toolGuideHTML(t.guide):`<div class="empty-state">此工具还没有维护指南。可交给 Agent 按本机实际安装补写。</div>`}</section>`:toolTab==='skill'?toolSkillPanel(t):toolUpdatesPanel(t)}<p class="tool-prototype-note">当前电脑 ${Model.state.active} · 安装记录、版本与文档为模拟数据，不表示真实安装或检查结果。</p>`}
function toolSkillPanel(t){const s=linkedToolSkill(t);return `<section class="tool-panel"><div class="tool-panel-head"><h2>配套 Skill</h2>${toolSkillBadge(t)}</div>${t.skill?`<div class="tool-skill-box"><span class="tool-logo mint">${I('layers')}</span><div><strong>${e(t.skill.name)}</strong><p>${e(t.skill.desc)}</p><small>${s?'已在'+(s.domain==='code'?'编码技能库':'龙虾技能库')+' · '+(s.category||'未分类'):'发现配套 Skill，尚未进入技能库。'}</small></div>${s?B('前往技能库','tool-open-skill',dataId(t.id),'green'):B('选择并入库','tool-skill-intake',dataId(t.id),'primary')}</div>${note('工具安装与 Skill 入库、Skill 部署分别执行。工具版本检查不代表配套 Skill 已更新；已入库 Skill 的上游变化继续走技能库更新流程。')}`:`<p class="muted">当前示例未登记配套 Skill；可让 Agent 查找官方提供的 Skill，或编写自建维护 Skill，再按现有流程入库。</p>${B('让 Agent 查找／编写 Skill','tool-task-skill',dataId(t.id),'green')}`}</section>`}
function toolUpdatesPanel(t){return `<section class="tool-panel"><div class="tool-panel-head"><h2>版本与更新</h2>${toolStatus(t)}</div>${versionChange(t.version,t.latest||'尚未确认','本机已安装')}<dl class="tool-facts"><dt>检查方式</dt><dd>${e(t.checkMethod)}</dd><dt>检查来源</dt><dd><code>${e(t.source)}</code></dd><dt>最近检查</dt><dd>${e(t.checkedAt)}</dd></dl>${t.checkState==='failed'?note(e(t.checkFailure)):t.checkState==='unconfigured'?note('需要 Agent 补充可查询的版本来源，软件才能检查。维护指南里的更新步骤不由软件直接执行。'):''}<div class="tool-update-description"><h3>${toolHasUpdate(t)?'发现新版本，等待你安排更新':'检查只获取版本信息'}</h3><p>Skill Manager 负责查询更新，不会直接执行包管理器、Git 或安装脚本。具体更新与验证由 Agent 根据维护指南完成，再回写本机记录。</p></div>${B(toolHasUpdate(t)?'生成 Agent 更新任务':'生成维护任务','tool-task-update',dataId(t.id),'primary')}</section>`}
function openTool(id,tab='overview'){toolId=id;toolTab=tab;closeDialog();render();document.querySelector('.content').scrollTop=0;const u=new URL(location.href);u.searchParams.set('view','tools');u.searchParams.set('tool',id);history.replaceState(null,'',u)}
function checkTools(id=null){if(toolChecking)return;toolChecking=true;const machine=Model.machine,rows=id?[findTool(id)]:toolStore().tools;render();setTimeout(()=>{for(const t of rows){if(t.checkMethod==='未登记'){t.checkState='unconfigured';continue}t.checkedAt='刚刚（模拟）';if(t.checkFailure)t.checkState='failed';else{t.checkState='ok';t.latest=t.id==='comfyui'?'rev 56cd78':t.latest||t.version}}toolChecking=false;if(Model.machine===machine)render();toast(Model.record('模拟版本检查完成；没有安装或更新工具。'));},450)}
function toolTaskText(t,kind,request=''){return ['请通过本项目工具中心的维护 Skill 与 CLI（命令行接口）处理以下工作。','任务：'+({update:'检查并按用户指令更新工具',guide:'补写或修订维护指南',skill:'查找／编写配套 Skill',install:'安装或登记本机工具，并生成维护指南'}[kind]),'工具：'+t.name,'工具简介：'+toolIntroduction(t),'用途／用户要求：'+(request||t.summary),'本机系统：'+Model.machine.system,'当前安装版本：'+(t.version||'尚未确认'),'检查到的上游版本：'+(t.latest||'尚未确认'),'安装方式：'+t.method,'安装位置：'+t.path,'配置位置：'+t.config,'版本检查方式：'+t.checkMethod,'检查来源：'+t.source,'','维护指南：',t.guide||'尚未提供。安装或登记时请按真实情况生成指南，包含用途、调用入口、安装方式、文件／配置位置、检查更新来源、更新步骤、更新后验证及注意事项。','','执行约定：','- 软件检查版本，Agent 负责实际安装／更新。先核对真实环境与上游说明，不凭本说明中的旧版本记录判断已更新。','- 使用实际安装方式完成工作，保留用户配置；完成后读取真实版本并验证入口、用途和服务状态，再回写本机安装记录与维护指南。失败应说明，不将失败回写为完成。','- 如工具提供 Skill，请选择编码／龙虾技能库后通过现有入库流程纳入 SkillManagerVault；没有合适 Skill 时先说明。入库不等于部署，按用户命令决定是否部署。','- 工具更新与配套 Skill 上游更新分别处理，不用更新工具来代替技能库的更新决定。','- 若修改 SkillManagerVault 内容，每次修改后询问我是否上传，未同意前保留本机修改。','- 当前页面是交互原型，所列路径、版本、来源均为模拟示例；正式执行前必须读取真实资料。'].join('\n')}
function toolTaskDialog(id,kind='update'){const t=findTool(id);modal={kind:'tool-task',id,taskKind:kind};dialog(kind==='guide'?'交给 Agent 维护指南':kind==='skill'?'交给 Agent 准备配套 Skill':'交给 Agent 更新 · '+e(t.name),'复制任务说明到外部 Agent，由 Agent 实际执行和回写。',field('任务说明',`<textarea class="field-input text-editor tool-task-output" id="tool-task-output" readonly>${e(toolTaskText(t,kind))}</textarea>`)+note('复制只生成任务，不代表 Agent 已开始或已完成。下方演示回报仅改变原型模拟数据。'),B('返回工具','tool-task-back',dataId(id))+B('演示 Agent 回报','tool-report',dataId(id))+B('复制任务说明','tool-copy-task','','primary'))}

function fileTree(files){const root=new Map();for(const path of files){let nodes=root;const parts=path.split('/');parts.forEach((name,i)=>{if(!nodes.has(name))nodes.set(name,{name,path:parts.slice(0,i+1).join('/'),children:new Map(),file:i===parts.length-1});nodes=nodes.get(name).children})}const list=nodes=>`<ul>${[...nodes.values()].sort((a,b)=>(a.name==='SKILL.md'?-1:b.name==='SKILL.md'?1:Number(a.file)-Number(b.file))||a.name.localeCompare(b.name)).map(n=>n.file?`<li><button class="file-link" data-action="file-read" data-file="${e(n.path)}" title="${e(n.path)}">${I('file')}<span>${e(n.name)}</span></button></li>`:`<li><details open><summary>${I('folder')}<span>${e(n.name)}</span></summary>${list(n.children)}</details></li>`).join('')}</ul>`;return files.length?`<div class="file-tree" aria-label="技能文件目录">${list(root)}</div>`:'<p class="muted">暂无文件。</p>'}

function drawPicker(){const m=modal,ss=Model.vault.libraries[m.domain];dialog('从库选择技能部署','选中技能后进入本机目标部署预览。',`<label class="search" style="width:100%">${I('search')}<input id="picker-search" placeholder="搜索技能…" value="${e(m.search)}"></label><div class="member-options picker-body">${ss.filter(s=>!m.search||[s.name,s.manager.comment].join(' ').includes(m.search)).map(s=>`<label class="member-option"><input type="checkbox" class="selectbox" data-choice="${e(s.id)}" ${m.choices.has(s.id)?'checked':''}><div class="member-option-text"><div class="member-option-name">${e(s.name)}<small>（${e(s.manager.comment)}）</small></div><div class="member-option-description">${e(s.description)}</div></div></label>`).join('')}</div>`,B('取消','close')+B('已选 '+m.choices.size+' · 进入部署','picker-save',!m.choices.size?'disabled':'','primary'))}
function createPresetDialog(){modal={kind:'preset-create',icon:'briefcase'};dialog('新建预设','创建后进入对应技能库，用卡片开关选择组合成员。',`<div class="preset-form"><div><label>预设名称</label>${input('preset-name','')}</div><div><label>管理域</label>${select('preset-domain',[['code','编码技能库'],['lobster','龙虾技能库']],codeDomain())}</div></div>${presetIconPicker(modal.icon)}`,B('取消','close')+B('创建并选择技能','preset-create-confirm','disabled','primary'));$('preset-name').focus()}
function presetRename(id){const p=Model.vault.presets.find(p=>p.id===id);modal={kind:'preset-rename',id,icon:presetIconKey(p),originalIcon:presetIconKey(p),originalName:p.name};dialog('重命名','',`<label class="preset-field-label">预设名称</label>${input('preset-edit-name',p.name)}${presetIconPicker(modal.icon)}`,B('取消','close')+B('保存','preset-rename-save','disabled','primary'));$('dialog').classList.add('compact-dialog');$('preset-edit-name').focus()}

function versionChange(from,to,label='上次仓库更新'){return `<div class="version-change"><div><span>${label}</span><code>${e(from)}</code></div>${I('right')}<div><span>上游最新</span><code class="next-version">${e(to)}</code></div></div>`}
function upstreamChangeRow(c,repo=null){const removed=c.kind==='deleted',s=repo?Model.vault.libraries[codeDomain()].find(s=>s.source===repo&&s.name===c.name):null;return `<div class="upstream-change-row"><div class="upstream-skill-line"><span class="change-kind ${removed?'removed':'modified'}">${removed?'删除':'修改'}</span><strong>${e(c.name)}</strong><small>${c.files.length} 个文件</small>${s?B('查看此技能','skill-update',dataId(s.id),'compact'):''}</div><div class="upstream-files">${c.files.map(f=>`<span>${I('file')}<code>${e(f)}</code></span>`).join('')}</div></div>`}
function updatesDialog(kind='all',context=null){if(kind==='skipped'){skippedUpdatesDialog();return}const pending=Model.pending(codeDomain(),kind),ctx=context||{filter:kind,drafts:{},scrollTop:0};modal={kind:'updates',filter:kind,context:ctx};dialog(kind==='new'?'来源仓库新增技能':'来源仓库变化','先查看变化，再决定是否更新；所有外部来源均需确认。',`<div class="upstream-repo-list">${pending.map(r=>`<article class="upstream-repo-card"><div class="upstream-repo-head"><div class="repo-identity"><span class="repo-symbol">${I('git')}</span><h3>${e(r.repo.name)}</h3></div><div class="repo-counts">${r.changes.length?`<span class="badge amber">${r.changes.length} 项变化</span>`:''}${r.additions.length?`<span class="badge green">${r.additions.length} 个新增</span>`:''}</div></div>${versionChange(r.repo.version,r.upstream.version)}${r.changes.length?`<div class="upstream-changes">${r.changes.map(c=>upstreamChangeRow(c,r.repo.id)).join('')}</div>`:''}${r.additions.length?`<div class="upstream-additions"><span class="change-group-label">新增可选</span><div>${r.additions.map(a=>`<span class="new-skill-chip">${I('plus')}${e(a.name)}</span>`).join('')}</div></div>`:''}<div class="repo-review-foot"><span>检查不会修改技能库</span>${B('查看并决定 '+I('right'),'repo-update',`data-repo="${e(r.repo.id)}"`,'green compact')}</div></article>`).join('')||'<div class="empty-state">当前没有待处理变化。</div>'}</div>`,B('已跳过版本'+(Model.pending(codeDomain(),'skipped').length?' · '+Model.pending(codeDomain(),'skipped').reduce((n,r)=>n+r.changes.length,0):''),'skipped-updates')+B('检查全部','check')+B('完成','close'));document.querySelector('#dialog .dialog-body').scrollTop=ctx.scrollTop}
function captureUpdateDraft(){const m=modal;m.context.drafts[m.repo]={choices:[...document.querySelectorAll('[data-new-name]:checked')].map(x=>x.dataset.newName),category:$('update-category')?.value||''}}
function repoUpdate(id,context=null){const r=Model.pending().find(r=>r.repo.id===id);if(!r)return;const ctx=context||{filter:'all',drafts:{},scrollTop:0};if(modal?.kind==='updates')ctx.scrollTop=document.querySelector('#dialog .dialog-body').scrollTop;const own=Model.vault.libraries[codeDomain()].filter(s=>s.source===id),draft=ctx.drafts[id]||{choices:[],category:own[0]?.category||r.repo.name};modal={kind:'repo-update',repo:id,context:ctx};dialog('查看并决定 · '+e(r.repo.name),'确认时处理该仓库尚未应用的变化；新增技能由你选择入库。',`<div class="repo-decision">${versionChange(r.repo.version,r.upstream.version)}<div class="change-section-title"><h3>已入库技能变化</h3><span>${r.changes.length} 项</span></div>${r.changes.length?`<div class="upstream-changes decision-changes">${r.changes.map(c=>upstreamChangeRow(c,r.repo.id)).join('')}</div>`:'<p class="muted">已有技能没有待更新内容。</p>'}<div class="change-section-title"><h3>新增技能 <small>勾选才入库</small></h3><span>${r.additions.length} 个</span></div>${r.additions.length?`<div class="member-options new-skill-options">${r.additions.map(a=>`<label class="member-option"><input type="checkbox" class="selectbox" data-new-name="${e(a.name)}" ${draft.choices.includes(a.name)?'checked':''}><div><div class="upstream-skill-line"><span class="change-kind added">新增</span><strong>${e(a.name)}</strong><small>（${e(a.comment)}）</small></div><p class="muted">${e(a.desc)}</p></div></label>`).join('')}</div>${field('新增技能的分类目录',input('update-category',draft.category))}`:'<p class="muted">没有新增技能。</p>'}${note('返回列表不会应用更新，也不会忽略新增。只有确认后，未勾选的新增才记为不入库。管理资料按既定规则保留或采用上游值；新增技能不自动部署。')}</div>`,B(I('back')+'返回仓库列表','repo-update-back')+B('确认更新','repo-update-confirm','','primary'))}

function intakeDialog(){modal={kind:'intake',url:'https://example.com/demo-tools.git',domain:codeDomain(),repo:null,category:'',choices:new Set(),previewURL:null,previewDomain:null};drawIntake()}
function intakePreview(){const m=modal;m.url=$('repo-url').value;m.domain=$('intake-domain').value;const same=m.repo&&m.previewURL===m.url.trim()&&m.previewDomain===m.domain;if(!same){m.repo=Model.candidateRepo(m.url.trim(),m.domain);m.category=m.repo.name;m.choices=new Set(m.repo.candidates.map(s=>s.name))}m.previewURL=m.url.trim();m.previewDomain=m.domain;drawIntake()}
function updateIntakeControls(){const m=modal;if(m?.kind!=='intake')return;const stale=m.repo&&(m.previewURL!==m.url.trim()||m.previewDomain!==m.domain),duplicates=m.repo?[...m.choices].filter(name=>Model.find(m.domain+':'+name)):[];document.querySelector('[data-action="intake-preview"]').disabled=!m.url.trim();document.querySelector('[data-action="intake-confirm"]').disabled=!m.repo||stale||!m.choices.size||duplicates.length>0;const count=$('intake-selected-count');if(count)count.textContent='已选 '+m.choices.size+' / '+m.repo.candidates.length;const status=$('intake-preview-status');status.classList.toggle('intake-warning',!!stale||duplicates.length>0);status.textContent=stale?'地址或管理域已更改，下方仍是上次预览结果；请重新预览后再入库。':duplicates.length?'同库已存在 '+duplicates.join('、')+'；请取消这些同名技能的勾选。':m.repo?'勾选需要的技能并确认入库；入库不会自动部署。':'仅模拟仓库预览，不访问输入网址或下载真实内容。'}
function drawIntake(){const m=modal;dialog('从来源仓库入库','填写来源、预览和选择技能都在当前页面完成。',`<div class="intake-source">${field('Git 仓库地址',`<div class="intake-url-row">${input('repo-url',m.url)}${B(m.repo?'重新预览':'预览仓库','intake-preview','','green')}</div>`,true)}<div class="manager-grid intake-options">${field('入库管理域',select('intake-domain',[['code','编码技能库'],['lobster','龙虾技能库']],m.domain))}${field('分类目录（最多一级）',`<input class="field-input" id="intake-category" value="${e(m.category)}" placeholder="预览后默认取仓库名，可修改" ${m.repo?'':'disabled'}>`)}</div></div><p class="intake-preview-status" id="intake-preview-status" role="status"></p>${m.repo?`<div class="intake-preview-head"><h3>${I('git')}${e(m.repo.name)} <span class="muted">仓库技能</span></h3><small id="intake-selected-count"></small></div><div class="member-options intake-candidates">${m.repo.candidates.map(s=>`<label class="member-option"><input type="checkbox" class="selectbox" data-intake-name="${e(s.name)}" ${m.choices.has(s.name)?'checked':''}><div><strong>${e(s.name)}</strong><small>（${e(s.comment)}）</small><p class="muted">${e(s.desc)}</p></div></label>`).join('')}</div>`:`<div class="intake-empty">${I('git')}<p>预览后，仓库技能会显示在这里。</p><small>来源地址和管理域始终保留在上方，可随时修改。</small></div>`}`,B('取消','close')+B('确认入库','intake-confirm','disabled','primary'));updateIntakeControls()}

function adoptDialog(t,names,p=null,entries=null){const rows=entries||names.map(name=>({target:t,name,profile:p}));const drafts=rows.map(row=>{const d=row.profile?Model.machine.profileLocal.find(d=>d.name===row.name&&d.profile===row.profile):Model.machine.deployments[row.target].find(d=>d.name===row.name);return {...row,category:d.category||'',manager:{comment:d.manager?.comment??d.comment??'',tags:d.manager?.tags??d.tags??[],zh:d.manager?.zh??d.zh??'',agents:d.manager?.agents??null,systems:d.manager?.systems??null}}});modal={kind:'adopt',entries:rows,drafts};const keys=rows.map(row=>(Model.lobsterTargets.includes(row.target)?'lobster':'code')+':'+row.name),duplicates=keys.filter((id,i)=>Model.find(id)||keys.indexOf(id)!==i);dialog('收编本机技能','补充入库资料，并接管技能在原 Agent 中的部署。',drafts.map((d,i)=>{const suffix=i?'-'+i:'',targets=Model.machine.agentOrder.filter(t=>(Model.lobsterTargets.includes(d.target)?Model.lobsterTargets:Model.codeTargets).includes(t)&&agentEnabled(t));return `<section class="adopt-skill-config"><div class="adopt-skill-head"><span class="adopt-skill-symbol">${I('upload')}</span><strong>${e(d.name)}</strong><span class="badge gray">${e(targetName(d.target))}${d.profile?' · '+e(profileNames[d.profile]):''}</span></div><div class="manager-grid skill-manager-grid">${field('中文注释（通常不超过 20 字）',input('adopt-comment'+suffix,d.manager.comment))}${field('标签（逗号分隔，支持多个）',input('adopt-tags'+suffix,d.manager.tags.join('，'),'例如：个人工具，常用'))}<div class="manager-left-stack">${field('分类目录（最多一级，可不分类）',input('adopt-category'+suffix,d.category))}${field('支持的系统 · 不声明则全部支持',supportField('adopt-system'+suffix,['macos','linux','windows'],d.manager.systems,x=>({macos:'macOS',linux:'Linux',windows:'Windows'}[x])))}</div>${field('支持的 Agent · 不声明则全部支持',supportField('adopt-agent'+suffix,targets,d.manager.agents,targetName))}</div><details class="adopt-translation" ${d.manager.zh?'open':''}><summary>中文正文翻译 <span>可选，仅用于管理器阅读</span></summary>${textarea('adopt-zh'+suffix,d.manager.zh)}</details></section>`}).join('')+note(duplicates.length?'同一技能库存在同名技能，已阻止收编：'+duplicates.map(e).join('、'):rows.some(d=>d.profile)?'档案独有技能收编后进入龙虾库与 default 技能池，保留原档案启用状态。':'原技能名与原始正文保持不变；管理资料进入 .manager，部署使用中文注释及适配内容。'),B('取消','close')+B('确认收编','adopt-confirm',duplicates.length?'disabled':'','primary'))}

function metaDialog(ids){modal={kind:'meta',ids};dialog('整理所选技能',ids.length+' 个技能 · 添加多个标签或移动分类目录。',field('追加标签（逗号分隔）',input('meta-tags',''))+field('分类目录（留空表示未分类）',input('meta-category',Model.find(ids[0])?.category||'')),B('取消','close')+B('保存','meta-save','','primary'))}
function categoryDialog(name=null){modal={kind:'category',name,domain:codeDomain()};dialog(name?'修改分类目录':'新建分类目录','分类就是一层实际目录；部署时仍使用原技能名。',field('目录名称',input('category-name',name||'')),(name?B('移到未分类并删除目录','category-delete'):'')+B('保存','category-save','','primary'))}
function archiveDialog(){const items=Model.vault.archived||[];modal={kind:'archive'};const rows=items.length?items.map(s=>`<div class="member-option"><div><strong>${e(s.name)}</strong><small>${s.domain==='code'?'编码库':'龙虾库'} · ${e(s.category||'未分类')}${s.manager.comment?' · '+e(s.manager.comment):''}</small></div>${B('还原','archive-restore',dataId(s.id),'compact')}${B('删除','archive-delete',dataId(s.id),'compact')}</div>`).join(''):'<p class="muted">当前没有已归档技能。</p>';dialog('已归档技能','归档后的技能不出现在技能库列表中；还原保留原分类与标签，不自动重新部署。',rows,B('关闭','close'))}
function tagsDialog(){modal={kind:'tags'};const ts=[...new Set(Model.skills().flatMap(s=>s.manager.tags))];dialog('管理标签','两个技能库的标签可统一整理，删除标签不会删除技能。',ts.map(t=>`<div class="member-option"><span class="tag ${tagColor(t)} flex">${e(t)}</span>${B('改名','tag-edit',`data-name="${e(t)}"`,'compact')}${iconButton('trash','tag-delete',`data-name="${e(t)}"`,'移除标签')}</div>`).join(''))}
function instructionsDialog(target='global'){
 modal={kind:'instructions',selected:target,search:'',draft:JSON.parse(JSON.stringify(Model.vault.instructions)),saved:false};drawInstructions();
}
function instructionNav(){const m=modal,q=m.search.toLowerCase();return `<button class="instruction-nav-item ${m.selected==='global'?'selected':''}" data-action="instruction-tab" data-target="global">全局指令</button>${Model.machine.instructionTargets.filter(t=>[t,targetName(t)].join(' ').toLowerCase().includes(q)).map(t=>`<button class="instruction-nav-item ${m.selected===t?'selected':''}" data-action="instruction-tab" data-target="${t}">${e(targetName(t))}</button>`).join('')}`}
function drawInstructions(){const m=modal,global=m.selected==='global';const specific=m.draft.specific[m.selected]||'';const composed=[m.draft.common,specific].filter(t=>String(t||'').trim()).join('\n\n');m.composedPreview=composed;const emptyHint=!global&&!String(specific).trim()?(m.draft.common&&String(m.draft.common).trim()?'该 Agent 暂无专属内容，将仅使用全局指令。':'全局与专属内容均为空。'):'';const emptyBlock=emptyHint?'<p class="instruction-empty-hint">'+emptyHint+'</p>':'';const preview='';$('dialog').classList.add('instructions-dialog');$('dialog').innerHTML='<div class="dialog-head"><div><h2>Agent 指令文件</h2></div>'+iconButton('x','close','','关闭')+'</div><div class="instruction-workspace"><aside class="instruction-sidebar"><div class="instruction-search-wrap">'+input('instruction-search',m.search,'搜索 Agent')+'</div><div class="instruction-nav" id="instruction-nav">'+instructionNav()+'</div></aside><div class="instruction-main"><label for="instruction-editor">'+(global?'全局指令':'专属指令 — '+e(targetName(m.selected)))+'</label><textarea class="field-input instruction-editor" id="instruction-editor" spellcheck="false">'+e(global?m.draft.common:specific)+'</textarea>'+emptyBlock+'</div></div><div class="dialog-foot"><div class="dialog-footer-actions">'+B('保存','instructions-save','','primary')+'</div></div>';$('overlay').classList.add('visible')}

function sourceDialog(id){const s=Model.find(id),r=Model.vault.sources.find(r=>r.id===s.source);modal={kind:'source',id};dialog('获取来源 · '+e(s.name),'正式维护和提交发生在自己的 SkillManagerVault。',r?`<div class="manager-grid">${field('来源仓库',`<p>${e(r.url)}</p>`,true)}${field('仓库内路径',`<p>${e(s.sourcePath)}</p>`)}${field('采用版本',`<p>${e(s.sourceVersion)}</p>`)}${field('已忽略的新增',`<p>${e(r.ignored.join('，')||'无')}</p>`,true)}</div>${note('不向来源仓库提交。来源更新由你确认，自己的库同步是另一条流程。')}`:note('自建技能已经位于自己的 SkillManagerVault，无外部来源更新。'),r?B('检查全部','check')+B('查看来源变化','repo-update',`data-repo="${e(r.id)}"`):'')}
function confirmDialog(title,text,action,data=''){modal={kind:'confirm'};dialog(title,'请确认本轮模拟操作。',note(text),B('取消','close')+B('确认',''+action,data,'primary'))}
const guides={intake:['入库到部署','从仓库选择少量技能，入库后仍未部署，再选择本机 Agent。'],upstream:['上游变化','检查已有仓库更新和新增，确认更新后检验管理资料保留与译文标记。'],remote:['多电脑同步','另一台电脑更新了库；同步后已有部署更新，新增技能不会自动首次部署。'],conflict:['副本有变更','受管副本被本机修改，只暂停这个技能，让 Agent 检查后由你裁决。'],platform:['支持与覆盖层','查看 web-check 的 Agent 限制、mac-notes 的系统限制，以及代码评审的 Codex 覆盖内容。']};
function playDialog(guide='intake'){modal={kind:'play',guide};const v=Model.vault,m=Model.machine;dialog('原型试玩','验证技能从来源入库、在自己的库维护、部署以及跨电脑同步是否连贯。',`<div class="seg tabs">${Object.entries(guides).map(([k,g])=>`<button data-guide="${k}" class="${guide===k?'on':''}">${g[0]}</button>`).join('')}</div><p>${guides[guide][1]}</p><div class="manager-grid">${field('当前电脑',`<p>${Model.state.active} · ${m.system}</p><p>编码技能 ${v.libraries.code.length} / 龙虾技能 ${v.libraries.lobster.length}</p>`)}${field('自己的库同步',`<p>本机版本 v${v.version} · 远端版本 v${Model.state.remote.version}</p><p>${m.conflict?'同步暂停':!Model.state.remote.connected?'远端不可用':v.dirty?'本地已保存，待上传':'已同步'}</p>`)}${field('本机部署',Model.targets.map(t=>`<span class="target-pill">${targetName(t)} ${m.deployments[t].length}</span>`).join(''),true)}${field('最近结果',`<p>${e(m.lastResult)}</p>`,true)}</div><h3 class="small-title">引导演练</h3><div class="detail-actions wrap">${guide==='intake'?B('① 重置并打开入库','guide-start',`data-value="intake"`)+B('② 查看库中新增','guide-library')+B('③ 选择库中技能部署','agent-add','data-target="codex"'):guide==='upstream'?B('① 重置并检查变化','guide-start','data-value="upstream"')+B('② 更新 Matt 仓库','guide-update')+B('③ 核对管理资料','skill',dataId('code:matt-code-review')):guide==='remote'?B('① 模拟其他电脑提交','remote-change')+B('② 同步自己的库','sync')+B('③ 切换另一台模拟电脑','machine-switch'):guide==='conflict'?B('① 查看有变更副本','local-detail','data-target="codex" data-name="matt-diagnosing-bugs"')+B('② 模拟库同步冲突','scenario','data-value="conflict"')+B('③ 按用户裁决采用远端','resolve-conflict'):B('① 限制 Agent 的技能','skill',dataId('code:web-check'))+B('② 切换 Windows','system-windows')+B('③ 查看专属覆盖层','guide-overlay')}</div><h3 class="small-title">自由试玩</h3><div class="detail-actions wrap">${B('重置原型','reset')}${B('重新打开原型','prototype-reopen')}${B('切换 macOS','system-macos')}${B('切换 Windows','system-windows')}${m.awaitingUploadApproval?B('确认是否上传','upload-request'):''}${B('切换电脑 A / B','machine-switch')}${B('切换远端在线状态','online-toggle')}${B('模拟其他电脑提交','remote-change')}${B('上游自带 .manager','scenario','data-value="manager"')}${B('模拟 Agent 创建','agent-create')}${B('模拟 Agent 修改与 CLI 同步','agent-edit')}${B('查看本轮操作记录','events')}</div>${note('所有电脑、仓库、版本和内容均为演示数据。实际 Git 同步、CLI、下载及系统托盘尚未实现；页面重新打开会保留本浏览器中的模拟状态；使用“重置原型”恢复初始数据。')}`)}
function uploadQuestion(){modal={kind:'upload-question'};dialog('Agent 询问：是否上传本次改动？','这是模拟维护 Skill 的对话，不是软件自动上传。',note('修改已保存在本机。已有部署是否同步取决于是否调用 CLI；上传与部署同步是两个独立动作。未经确认不会提交推送，手动或定时同步也不会替你上传这批改动。'),B('暂不上传','upload-later')+B('确认上传','upload-approve','','primary'))}
function agentEditDialog(){const s=Model.find('code:matt-ask-matt');modal={kind:'agent-edit',id:s.id};dialog('模拟 Agent 维护','Agent 在 SkillManagerVault 修改，随后调用 CLI 同步已有部署。',textarea('agent-body',s.body)+'<p class="muted">创建与部署是两个场景。这里修改原内容，不通过管理器改写原正文。</p>',B('只模拟保存内容','agent-save')+B('模拟保存并调用 CLI 同步','agent-cli','','primary'))}
function chosenIds(){return [...selected].filter(Model.find)}

const csv=s=>s.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
let cardMenuTrigger=null;
function closeCardMenu(){document.getElementById('card-menu')?.remove();if(cardMenuTrigger){cardMenuTrigger.setAttribute('aria-expanded','false');cardMenuTrigger.closest('.card')?.classList.remove('menu-open');cardMenuTrigger=null}}
function openCardMenu(trigger,id){if(cardMenuTrigger===trigger){closeCardMenu();return}closeCardMenu();const s=Model.find(id),menu=document.createElement('div');menu.id='card-menu';menu.className='card-menu';menu.setAttribute('role','menu');menu.setAttribute('aria-label',s.name+' 的操作');const item=(icon,label,action,danger=false)=>`<button role="menuitem" class="${danger?'danger':''}" data-action="${action}" ${dataId(id)}>${I(icon)}${label}</button>`;menu.innerHTML=item('copy','复制到另一库','copy-skill')+item('folder','移动到分类…','skill-move')+item('plus','添加标签…','skill-add-tags')+item('file','生成维护任务…','maintenance-task')+item('folder','归档…','skill-archive')+item('trash','删除','skill-delete',true);document.body.append(menu);const rect=trigger.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(innerWidth-menu.offsetWidth-8,rect.right-menu.offsetWidth))+'px';menu.style.top=(rect.bottom+5+menu.offsetHeight>innerHeight?Math.max(8,rect.top-menu.offsetHeight-5):rect.bottom+5)+'px';cardMenuTrigger=trigger;trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-haspopup','menu');trigger.closest('.card').classList.add('menu-open')}
function addSkillTagsDialog(id){const s=Model.find(id),all=[...new Set(Model.skills().flatMap(s=>s.manager.tags))].sort((a,b)=>a.localeCompare(b));modal={kind:'skill-add-tags',id};dialog('添加标签 · '+e(s.name),'从已有标签选择，也可以输入新标签；保留技能现有标签。',`<div class="checklist tag-options">${all.map(t=>`<label><input type="checkbox" data-add-tag value="${e(t)}" ${s.manager.tags.includes(t)?'checked disabled':''}>${tags([t])}</label>`).join('')}</div>${field('新标签（多个用逗号分隔）',`<textarea class="field-input" id="skill-new-tags" placeholder="例如：日常运维，常用" style="height:64px;resize:none"></textarea>`)}`,B('取消','close')+B('添加','skill-add-tags-save','','primary'));$('skill-new-tags').focus()}
function moveSkillDialog(id){const s=Model.find(id),cs=[...new Set(Model.vault.libraries[s.domain].map(s=>s.category).filter(Boolean))];modal={kind:'skill-move',id};dialog('移动到分类 · '+e(s.name),'移动实际库目录，技能名、已有部署与预设归属保持不变。',field('分类目录（最多一级，留空为未分类）',`<input class="field-input" id="move-category" list="move-categories" value="${e(s.category)}"><datalist id="move-categories">${cs.map(c=>`<option value="${e(c)}"></option>`).join('')}</datalist>`),B('取消','close')+B('移动','skill-move-save','','primary'));$('move-category').focus()}
function singleSkillUpdateDialog(id,back=null){const s=Model.find(id),r=Model.pending(s.domain,back==='skipped'?'skipped':'all').find(r=>r.repo.id===s.source&&r.changes.some(c=>c.name===s.name));if(!r){toast('该技能没有待处理的上游变化。');return}const c=r.changes.find(c=>c.name===s.name);if(modal?.kind==='repo-update')captureUpdateDraft();if(!back&&['updates','repo-update'].includes(modal?.kind))back={kind:modal.kind,repo:modal.repo,context:modal.context};modal={kind:'skill-update',id,back};dialog('更新技能 · '+e(s.name),'仅处理当前库中的此技能，同仓库其他技能与新增候选保持不变。',`<p class="update-source-caption">${I('git')}${e(r.repo.name)} ${back==='skipped'?'<span class="badge gray">已跳过此版本</span>':''}</p>${versionChange(s.sourceVersion,r.upstream.version,'当前采用')}<div class="upstream-changes decision-changes">${upstreamChangeRow(c)}</div>${note(c.kind==='deleted'?'确认后从当前库移除此技能并清理本机受管部署；副本有本地变更的项继续暂停。':'保留本地分类；上游未提供的管理资料保留，同项采用上游值。已有译文标记待核对，更新本机已有部署。')}`,B(back?'返回列表':'取消','skill-update-back')+(back==='skipped'?B('恢复提醒','skill-restore-version',dataId(id)):B('跳过当前版本','skill-skip-version',dataId(id)))+B(c.kind==='deleted'?'确认移除该技能':'确认更新此技能','skill-update-confirm','','primary'))}
function returnFromSkillUpdate(back){render();if(back==='skipped')skippedUpdatesDialog();else if(back?.kind==='repo-update'&&Model.pending().some(r=>r.repo.id===back.repo))repoUpdate(back.repo,back.context);else if(back)updatesDialog(back.context.filter,back.context);else closeDialog()}
function skippedUpdatesDialog(){modal={kind:'skipped-updates'};const repos=Model.pending(codeDomain(),'skipped');dialog('已跳过的上游版本','跳过只针对当前版本；下个版本会重新提醒，已有内容和部署保留。',repos.map(r=>`<article class="upstream-repo-card"><div class="upstream-repo-head"><div class="repo-identity"><span class="repo-symbol">${I('git')}</span><h3>${e(r.repo.name)}</h3></div><span class="badge gray">上游 ${e(r.upstream.version)}</span></div>${r.changes.map(c=>{const s=Model.vault.libraries[codeDomain()].find(s=>s.source===r.repo.id&&s.name===c.name);return `<div class="skipped-version-row"><div><strong>${e(s.name)}</strong><p class="muted">当前采用 <code>${e(s.sourceVersion)}</code></p></div>${B('查看此版本','skipped-review',dataId(s.id),'compact')}${B('恢复提醒','skill-restore-version',dataId(s.id),'compact green')}</div>`}).join('')}</article>`).join('')||'<div class="empty-state">当前没有已跳过的上游版本。</div>',B('返回变化列表','updates')+B('完成','close'))}
function maintenanceText(ids,request){const ss=ids.map(Model.find).filter(Boolean);return ['请通过本项目的维护 Skill（技能）与 CLI（命令行接口）维护以下技能。','SkillManagerVault 本机目录：'+Model.machine.vaultPath,'','我的维护要求：',request.trim()||'请先与我确认具体修改目标，再执行修改。','','所选技能（以下为当前管理资料快照）：',...ss.flatMap(s=>['- '+s.name+'（'+(s.domain==='code'?'编码技能库':'龙虾技能库')+'）','  库内路径：'+Model.machine.vaultPath+'/'+(s.domain==='code'?'Code':'Lobster')+'/'+(s.category?s.category+'/':'')+s.name,'  中文注释：'+(s.manager.comment||'未填写'),'  分类：'+(s.category||'未分类')+'；标签：'+(s.manager.tags.join('、')||'无'),'  支持 Agent：'+(s.manager.agents?.map(targetName).join('、')??'全部支持（未声明）')+'；系统：'+(s.manager.systems?.join('、')??'全部支持（未声明）'),'  中文阅读译文：'+(s.manager.zh?(s.manager.stale?'已有，待核对':'已有'):'未提供')+'；覆盖文件：'+(s.manager.overlays.map(o=>o.file+' ['+o.agent+'/'+o.system+']').join('、')||'无'),'  本机已部署：'+(deployed(s).map(targetName).join('、')||'无')]),'','维护约定：','1. 先读取维护 Skill 与相关文件，在 SkillManagerVault 内维护统一内容；Hermes 档案只管理使用，不单独修改技能。','2. 按上述要求维护中文正文／注释、一级分类、标签、支持声明与 .manager（管理层）；无关内容保持原样。中文阅读译文不自动替代部署正文。','3. 保留来源追踪；不向来源仓库提交。覆盖层替换 SKILL.md 时，部署使用整份覆盖正文。','4. 修改后使用项目 CLI 同步本机已有部署，不新增部署、不更改档案启用选择。先查看 CLI 帮助确认实际命令，不猜测命令语法；若受管副本有冲突，检查并向我说明，交由我决定。','5. 每次修改后主动询问我是否提交上传自己的 SkillManagerVault；未明确同意前只保留本机修改和已有部署同步结果，不上传。','6. 汇报修改了哪些技能、文件、管理资料及已有部署同步结果。'].join('\n')}
function maintenanceDialog(ids){modal={kind:'maintenance',ids};dialog('生成维护任务',ids.length+' 个技能 · 复制说明后交给外部 Agent。',field('希望 Agent 做什么',`<textarea class="field-input text-editor" id="maintenance-request" placeholder="例如：把所选技能的正文和注释改为中文，整理分类与标签。"></textarea>`)+field('任务说明 · 随上方要求更新',`<textarea class="field-input text-editor maintenance-output" id="maintenance-output" readonly></textarea>`)+note('这里只生成可复制的任务说明；尚未调用 Agent 或执行维护。原型中的路径和资料为模拟数据。'),B('取消','close')+B('复制任务说明','maintenance-copy','','primary'));$('maintenance-output').value=maintenanceText(ids,'')}

document.addEventListener('scroll',ev=>{if(!ev.target.closest?.('#card-menu'))closeCardMenu()},true);
window.addEventListener('resize',closeCardMenu);

function validCategory(name){if(/[\/\\]/.test(name)){toast('分类最多一级，请使用一个目录名称。');return false}return true}
function saveInstructions(){const m=modal,result=Model.instructionsSave(m.draft.common,m.draft.specific);m.saved=true;render();drawInstructions();toast(result)}
document.addEventListener('click',ev=>{if(!ev.target.closest('#rocket-menu,[data-action="preset-rocket"]'))closeRocketMenu();const menuWas=openMenu;if(openMenu&&!ev.target.closest('[data-action="filter-menu"],[data-action="filter-pick"],.filter-menu-panel'))openMenu=null;if(!ev.target.closest('[data-action="card-menu"]'))closeCardMenu();const card=ev.target.closest('.card[data-selection-key]');if(multi&&card&&!ev.target.closest('input,a')&&(!ev.target.closest('button')||['skill','local-detail','profile-detail'].includes(ev.target.closest('button').dataset.action))){const key=card.dataset.selectionKey;selected.has(key)?selected.delete(key):selected.add(key);render();return}const el=ev.target.closest('[data-action],[data-view],[data-preset],[data-tag],[data-category],[data-filter],[data-domain],[data-profile],[data-guide]');if(!el||el.disabled){if(menuWas&&!openMenu)render();return}
if(el.hasAttribute('data-view')){if(el.dataset.view==='presets')domain=codeDomain();nav(el.dataset.view);return}
if(el.hasAttribute('data-preset')){nav('preset-detail',Model.vault.presets.find(p=>p.id===el.dataset.preset));return}
if(el.hasAttribute('data-domain')){domain=el.dataset.domain;const ps=presetsIn(domain);if(['presets','preset-detail'].includes(view)){if(ps[0])nav('preset-detail',ps[0]);else{presetId='';view='presets';query='';category='';resetTags();filter='all';selected.clear();render()}}else render();return}
if(el.hasAttribute('data-profile')&&!el.hasAttribute('data-action')){profile=el.dataset.profile;picker=false;query='';category='';resetTags();filter='all';selected.clear();render();return}
if(el.hasAttribute('data-guide')){playDialog(el.dataset.guide);return}
if(el.hasAttribute('data-tag')){toggleTag(el.dataset.tag);selected.clear();render();return}
if(el.hasAttribute('data-category')){category=el.dataset.category;selected.clear();render();return}
if(el.hasAttribute('data-filter')){filter=el.dataset.filter;selected.clear();render();return}
const a=el.dataset.action,id=el.dataset.id,t=el.dataset.target,n=el.dataset.name,m=modal;
switch(a){
case 'close':closeDialog();break;
case 'tool-detail':openTool(id);break;

case 'tool-tab':toolTab=el.dataset.value;render();break;
case 'tool-guide':openTool(id,'guide');break;
case 'tool-category':toolCategory=el.dataset.value;render();break;
case 'tool-filter':toolFilter=el.dataset.value;render();break;
case 'tools-check':checkTools();break;
case 'tool-check':checkTools(id);break;
case 'tool-copy-entry':copyToolText(findTool(id).entry);break;
case 'tool-task-update':toolTaskDialog(id,'update');break;
case 'tool-task-guide':toolTaskDialog(id,'guide');break;
case 'tool-task-skill':toolTaskDialog(id,'skill');break;
case 'tool-copy-task':copyToolText($('tool-task-output').value,'tool-task-output');break;
case 'tool-task-back':openTool(id);break;
case 'tool-register':toolRegisterDialog();break;
case 'tool-register-task':toolRegisterTask();break;
case 'tool-report':toolReportDialog(m.id,m.draft||null,m.taskKind);break;
case 'tool-report-save':saveToolReport();break;
case 'tool-skill-intake':toolSkillIntakeDialog(id);break;
case 'tool-skill-intake-confirm':{const t=findTool(m.id),d=$('tool-skill-domain').value,c=$('tool-skill-category').value.trim();if(!validCategory(c))break;if(Model.find(d+':'+t.skill.name)){toast('该技能库已存在同名技能，请到库内查看。');break}const repo=Model.candidateRepo(t.skill.source,d);repo.candidates=[{name:t.skill.name,comment:$('tool-skill-comment').value.trim(),desc:t.skill.desc,tags:csv($('tool-skill-tags').value),files:2}];const result=Model.intake(repo,[t.skill.name],d,c);t.skill.domain=d;openTool(t.id,'skill');toast(result);break;}
case 'tool-open-skill':{const skill=linkedToolSkill(findTool(id));nav(skill.domain);skillDialog(skill.id);break;}

case 'clear-filters':query='';category='';resetTags();filter='all';deployedTo='';libraryPreset='';openMenu=null;selected.clear();render();break;
case 'layout':layout=el.dataset.value;render();break;
case 'multi':multi=!multi;selected.clear();render();break;

case 'skill-update':singleSkillUpdateDialog(id);break;
case 'skill-update-confirm':{const result=Model.applySkillUpstream(m.id);returnFromSkillUpdate(m.back);toast(result);break;}

case 'skill-skip-version':{const result=Model.skipSkillVersion(id);returnFromSkillUpdate(m.back);toast(result);break;}

case 'skill-add-tags':addSkillTagsDialog(id);break;
case 'skill-add-tags-save':{const s=Model.find(m.id),added=[...document.querySelectorAll('[data-add-tag]:checked')].map(x=>x.value).concat(csv($('skill-new-tags').value));finish(Model.updateSkill(m.id,{manager:{tags:[...new Set([...s.manager.tags,...added])]}}));break;}
case 'skill-move':moveSkillDialog(id);break;
case 'skill-move-save':{const c=$('move-category').value.trim();if(validCategory(c))finish(Model.updateSkill(m.id,{category:c}));break;}

case 'skill-tab':skillDialog(m.id,el.dataset.value,m.local,m.readOnly);break;
case 'profile-detail':profileSkillDialog(n);break;

if(el.dataset.choice){el.checked?modal.choices.add(el.dataset.choice):modal.choices.delete(el.dataset.choice);drawPicker()}
if(el.dataset.intakeName){el.checked?modal.choices.add(el.dataset.intakeName):modal.choices.delete(el.dataset.intakeName);updateIntakeControls()}
if(el.id==='intake-domain'&&modal?.kind==='intake'){modal.domain=el.value;updateIntakeControls()}
if(el.id==='filter-deploy-target'){deployedTo=el.value;selected.clear();render()}
if(el.id==='filter-library-preset'){libraryPreset=el.value;selected.clear();render()}
if(el.dataset.action==='device-select'){const id=el.value,dev=(Model.state.devices||[]).find(d=>d.id===id);if(!dev||!dev.online){el.value=Model.state.currentDevice;toast('该设备离线，不能操作，也不会用缓存技能顶上。')}else{Model.state.currentDevice=id;Model.switchMachine(id);render();toast('已切换到 '+dev.name+'，界面只显示该机。')}}
if(el.dataset.supportAll){document.querySelectorAll(`[data-support="${el.dataset.supportAll}"]`).forEach(c=>c.disabled=el.checked)}});
document.addEventListener('input',ev=>{if(ev.target.id==='tool-search'){toolQuery=ev.target.value;const pos=ev.target.selectionStart;render();$('tool-search').focus();$('tool-search').setSelectionRange(pos,pos)}if(ev.target.id==='maintenance-request')$('maintenance-output').value=maintenanceText(modal.ids,ev.target.value);if(modal?.kind==='intake'&&['repo-url','intake-category'].includes(ev.target.id)){modal[ev.target.id==='repo-url'?'url':'category']=ev.target.value;updateIntakeControls()}if(ev.target.id==='preset-name'||ev.target.id==='preset-edit-name')updatePresetSubmit();if(ev.target.id==='instruction-editor'){if(modal.selected==='global')modal.draft.common=ev.target.value;else modal.draft.specific[modal.selected]=ev.target.value;modal.saved=false;const hint=document.querySelector('.instructions-dialog .dialog-foot small');if(hint)hint.textContent='模拟数据 · 未保存';}if(ev.target.id==='instruction-search'){modal.search=ev.target.value;$('instruction-nav').innerHTML=instructionNav();}if(ev.target.id==='search-input'){query=ev.target.value;selected.clear();const pos=ev.target.selectionStart;render();$('search-input').focus();$('search-input').setSelectionRange(pos,pos)}if(ev.target.id==='picker-search'){modal.search=ev.target.value;drawPicker();$('picker-search').focus();$('picker-search').setSelectionRange(modal.search.length,modal.search.length)}});
let dragging=null;
function moveVisible(full,visible,from,to,key){const ids=[...visible],a=ids.indexOf(from),b=ids.indexOf(to);if(a<0||b<0||a===b)return full;ids.splice(b,0,ids.splice(a,1)[0]);let n=0;return full.map(item=>{if(!visible.includes(key(item)))return item;const id=ids[n++];return full.find(x=>key(x)===id)})}
function clearDrag(){document.querySelectorAll('.dragging,.drop-target').forEach(el=>el.classList.remove('dragging','drop-target'));document.body.classList.remove('is-sorting');dragging=null}
function dragTarget(kind){return kind==='preset'?'.preset-row':kind==='agent'?'.settings-agent-card':kind==='category'?'.category[data-sort-category]':'.card[data-skill]'}
document.addEventListener('dragstart',ev=>{const h=ev.target.closest('[data-drag-kind]');if(!h)return;dragging={kind:h.dataset.dragKind,id:h.dataset.dragId,domain:codeDomain(),view,preset:presetId};ev.dataTransfer.setData('text/plain',dragging.id);ev.dataTransfer.effectAllowed='move';const item=h.closest('.preset-row,.card,.settings-agent-card,.category[data-sort-category]');if(!item){dragging=null;return}item.classList.add('dragging');document.body.classList.add('is-sorting');ev.dataTransfer.setDragImage(item,18,18)});
document.addEventListener('dragover',ev=>{if(!dragging)return;ev.preventDefault();const item=ev.target.closest(dragTarget(dragging.kind));document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));if(!item)return;ev.dataTransfer.dropEffect='move';item.classList.add('drop-target')});
document.addEventListener('drop',ev=>{if(!dragging)return;const d=dragging,item=ev.target.closest(dragTarget(d.kind));ev.preventDefault();if(!item){clearDrag();return}if(d.kind!=='preset'&&d.domain!==codeDomain()){clearDrag();return}const to=d.kind==='preset'?item.dataset.sortPreset:d.kind==='agent'?item.dataset.agent:d.kind==='category'?item.dataset.sortCategory:item.dataset.skill;if(to===d.id){clearDrag();return}
 if(d.kind==='agent'){const visible=[...item.parentElement.querySelectorAll('[data-agent]')].map(el=>el.dataset.agent);Model.machine.agentOrder=moveVisible(Model.machine.agentOrder,visible,d.id,to,x=>x);Model.record('本机 Agent 显示顺序已保存')}
 else if(d.kind==='preset'){const visible=[...document.querySelectorAll('.preset-section .preset-row')].map(el=>el.dataset.sortPreset);const ids=reorderIds(visible,d.id,to);if(ids)applyPresetOrder(Model.vault.presets.find(p=>p.id===d.id)?.domain||domain,ids)}
 else if(d.kind==='category'){const from=d.id==='__none'?'':d.id,dest=to==='__none'?'':to;const visible=[...document.querySelectorAll('.category[data-sort-category]')].map(el=>el.dataset.sortCategory==='__none'?'':el.dataset.sortCategory);const ids=reorderIds(visible,from,dest);if(ids){const full=categoryNames(d.domain);let n=0;Model.vault.categoryOrder[d.domain]=full.map(c=>visible.includes(c)?ids[n++]:c);Model.record('分类显示顺序已保存')}}
 else {const visible=[...document.querySelectorAll('#skill-grid [data-skill]')].map(el=>el.dataset.skill);if(view==='preset-detail'||view==='presets'){const p=preset(),ordered=moveVisible(presetSkills(p),visible,d.id,to,s=>s.id).map(s=>s.id);Model.presetSave({...p,order:ordered,members:ordered.filter(id=>p.members.includes(id))})}else{Model.vault.libraries[d.domain]=moveVisible(Model.vault.libraries[d.domain],visible,d.id,to,s=>s.id);Model.save('技能显示顺序已保存，目录和部署保持原样')}}
 clearDrag();render();toast(Model.machine.lastResult)
});document.addEventListener('dragend',clearDrag);
$('overlay').addEventListener('click',ev=>{if(ev.target===$('overlay'))closeDialog()});document.addEventListener('focusout',ev=>{if(ev.target.id!=='category-rename'||!renamingCategory)return;const token=renamingCategory.token,value=ev.target.value;setTimeout(()=>{if(renamingCategory&&renamingCategory.token===token)commitCategoryRename(value)},0)});
document.addEventListener('keydown',ev=>{if(ev.target.id==='category-rename'&&['Enter','Escape'].includes(ev.key)){ev.preventDefault();if(ev.key==='Escape')cancelCategoryRename();else commitCategoryRename(ev.target.value);return}if(ev.target.id==='setting-path-value'&&['Enter','Escape'].includes(ev.key)){ev.preventDefault();if(ev.key==='Enter')saveSettingsPath();else{settingsPathEdit=null;render()}return}if(ev.key==='Escape'){if(document.getElementById('card-menu')){const trigger=cardMenuTrigger;closeCardMenu();trigger?.focus();return}if(modal)closeDialog();else if(picker){picker=false;render()}else if(multi&&!ev.target.closest('input,textarea')){multi=false;selected.clear();render()}}if(ev.key==='Enter'&&modal?.kind==='preset-rename'&&ev.target.id==='preset-edit-name')document.querySelector('[data-action="preset-rename-save"]').click()});
document.body.classList.toggle('capture',params.get('capture')==='1');render();
if(params.get('modal')==='updates')updatesDialog();
if(params.get('modal')==='preset-deploy')deployDialog(preset().members);
if(params.get('modal')==='preset-create')createPresetDialog();
if(params.get('modal')==='preset-rename')presetRename(presetId);
if(params.get('modal')==='instructions')instructionsDialog(params.get('instruction')||'global');

</script>
</body>
</html>
