[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
skill-manager-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
walkdir = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
thiserror = "2"
regex = "1"
anyhow = "1"
ctrlc = "3"

[profile.release]
lto = true
codegen-units = 1
