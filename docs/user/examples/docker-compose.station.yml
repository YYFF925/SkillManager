# 只跑统一管理站。各机 Host 仍装在系统里，不要加进这个 compose。
# 用法（仓库根目录）：
#   docker compose -f docs/user/examples/docker-compose.station.yml up --build
# 前面再加你自己的 HTTPS 反代。

services:
  station:
    build:
      context: ../../..
      dockerfile: docs/user/examples/Dockerfile.station
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - station-data:/data
    restart: unless-stopped

volumes:
  station-data:
