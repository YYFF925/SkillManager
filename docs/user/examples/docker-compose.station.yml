# Skill Manager 管理站（推荐）。不要在这里加 Host。
# 与 docs/user/station.md 第四节同一份配置。
#
# 任意目录：
#   docker compose up -d
# 更新镜像：
#   docker compose pull && docker compose up -d
# 前面再加你自己的 HTTPS 反代，指到 127.0.0.1:8787。

services:
  station:
    image: ghcr.io/yyff925/skill-manager-station:latest
    container_name: skill-manager-station
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - station-data:/data
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  station-data:
